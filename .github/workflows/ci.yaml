name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Enforces the quality bar the docs already claim: a --fatal-infos-clean
# analyze and a green test suite. Both were manual-only before this workflow.
jobs:
  dart:
    name: Analyze & test (Dart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: flutter test

  python:
    name: Lint & test (Python codegen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          # Matches `requires-python = ">=3.11"` in pyproject.toml.
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check

      - name: Test
        run: pytest
