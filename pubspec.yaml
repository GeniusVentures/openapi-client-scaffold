name: frontend_scaffold
description: "Shared Flutter scaffolding widgets — generic blocs, theme primitives, breakpoints, drawers, toasts, and animations."
publish_to: 'none'
version: 0.4.0

environment:
  # Matches the floor the consuming repos declare (GeniusWallet: sdk ^3.10.0).
  # No separate `flutter:` key: Dart ^3.10.0 already implies Flutter 3.40+, and
  # a second constraint only drifts out of sync with this one.
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0
  auto_size_text: ^3.0.0
  loading_animation_widget: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
